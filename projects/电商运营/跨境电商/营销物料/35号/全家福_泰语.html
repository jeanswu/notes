<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'Thai';src:url('file:///usr/share/fonts/truetype/noto/NotoSansThai-Regular.ttf') format('truetype');font-weight:400;}
  @font-face{font-family:'Thai';src:url('file:///usr/share/fonts/truetype/noto/NotoSansThai-Bold.ttf') format('truetype');font-weight:700;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;background:#fff;font-family:'Thai','DejaVu Sans',sans-serif;}
  .wrap{padding:0 0 40px;}
  .hero{width:1080px;background:#f2f2f2;display:flex;justify-content:center;align-items:center;padding:26px 40px;}
  .hero img{max-width:900px;height:auto;display:block;}
  .bar{background:#4a4a4a;color:#fff;padding:22px 40px;display:flex;align-items:center;gap:26px;}
  .bar .t{font-size:42px;font-weight:700;letter-spacing:1px;}
  .bar .v{font-size:40px;font-weight:400;color:#e8e8e8;letter-spacing:3px;}
  .row{display:flex;gap:6px;padding:6px;}
  .card{flex:1;background:#f4f4f4;padding:18px 14px 22px;display:flex;flex-direction:column;align-items:center;}
  .card img{width:100%;height:auto;display:block;}
  .cap{margin-top:16px;display:inline-flex;align-items:center;gap:14px;background:#1a1a1a;border-radius:100px;padding:10px 30px;}
  .cap .n{font-size:28px;font-weight:700;color:#fff;}
  .cap .v{font-size:28px;color:#fff;}
  .dim{margin-top:10px;font-size:22px;color:#666;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/sz_m.png"></div>
  <div class="bar">
    <span class="t">สีดำหรูหรา</span>
    <span class="v">36L · 52L</span>
  </div>
  <div class="row">
    <div class="card">
      <img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/sz_s.png">
      <div class="cap"><span class="n">เล็ก</span><span class="v">36 ลิตร</span></div>
      <div class="dim">35 × 35 × 30 ซม.</div>
    </div>
    <div class="card">
      <img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/sz_m.png">
      <div class="cap"><span class="n">กลาง</span><span class="v">52 ลิตร</span></div>
      <div class="dim">50 × 35 × 30 ซม.</div>
    </div>
  </div>
</div>
</body>
</html>
