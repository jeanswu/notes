<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family:'Thai'; src:url('file:///usr/share/fonts/truetype/noto/NotoSansThai-Regular.ttf') format('truetype'); font-weight:400; }
  @font-face { font-family:'Thai'; src:url('file:///usr/share/fonts/truetype/noto/NotoSansThai-Bold.ttf') format('truetype'); font-weight:700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:#fff; font-family:'Thai',sans-serif; overflow:hidden; }
  .wrap { width:1080px; height:1080px; padding:56px 52px; }

  .head { text-align:center; margin-bottom:34px; }
  .h1 { font-size:50px; font-weight:700; color:#111; line-height:1.3; }
  .h2 { font-size:22px; color:#909090; margin-top:8px; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .cell { background:#f7f7f7; border-radius:20px; overflow:hidden; }
  .ph { width:100%; height:262px; overflow:hidden; background:#ececec; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .tx { padding:18px 20px 20px; text-align:center; }
  .t1 { font-size:27px; font-weight:700; color:#111; line-height:1.3; }
  .t2 { font-size:19px; color:#8a8a8a; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="h1">รายละเอียดที่ใส่ใจ</div>
    <div class="h2">ทุกจุดออกแบบมาเพื่อการใช้งานจริง</div>
  </div>

  <div class="grid">

    <div class="cell">
      <div class="ph"><img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/d_handle.png"></div>
      <div class="tx">
        <div class="t1">หูหิ้วอะลูมิเนียม</div>
        <div class="t2">จับถนัด มั่นคง</div>
      </div>
    </div>

    <div class="cell">
      <div class="ph"><img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/d_buckle.png"></div>
      <div class="tx">
        <div class="t1">ตัวล็อกปรับได้</div>
        <div class="t2">รัดกระชับ ไม่ให้ของเลื่อน</div>
      </div>
    </div>

    <div class="cell">
      <div class="ph"><img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/d_reflect.png"></div>
      <div class="tx">
        <div class="t1">แถบสะท้อนแสง</div>
        <div class="t2">มองเห็นง่ายในที่มืด</div>
      </div>
    </div>

    <div class="cell">
      <div class="ph"><img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/d_pocket.png"></div>
      <div class="tx">
        <div class="t1">ซองข้างขนาดใหญ่</div>
        <div class="t2">เก็บของชิ้นเล็กได้เพิ่ม</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
