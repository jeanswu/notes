<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'ThaiSans';
    src: url('file:///usr/share/fonts/truetype/noto/NotoSansThai-Regular.ttf');
  }
  @font-face {
    font-family: 'ThaiSans';
    font-weight: 700;
    src: url('file:///usr/share/fonts/truetype/noto/NotoSansThai-Bold.ttf');
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; }
  body {
    font-family: 'ThaiSans', 'Noto Sans Thai', sans-serif;
    background:#ffffff; color:#111;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width:1080px; height:1920px; display:flex; flex-direction:column; }

  .head { height:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; }
  .h1 { font-size:52px; font-weight:700; letter-spacing:0.5px; }
  .h2 { font-size:26px; color:#777; margin-top:16px; }

  .scene { width:1080px; height:1240px; flex-shrink:0; overflow:hidden; }
  .scene img { width:1080px; height:1240px; object-fit:cover; display:block; }

  .foot { flex:1; display:flex; padding:20px 40px 22px; gap:28px; background:#f7f7f8; }
  .card { flex:1; background:#fff; border-radius:20px; display:flex; flex-direction:column;
          align-items:center; justify-content:center; padding:18px 10px 20px; }
  .card .pic { width:100%; height:190px; display:flex; align-items:center; justify-content:center; }
  .card .pic img { max-width:100%; max-height:100%; object-fit:contain; }
  .card .cap { font-size:27px; font-weight:700; margin-top:12px; }
  .card .sub { font-size:22px; color:#888; margin-top:8px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="h1">ศาสตร์การพับเก็บ</div>
      <div class="h2">ออกแบบให้พับได้ตามการใช้งาน ไม่ใช้ก็พับแบนเก็บง่าย</div>
    </div>
    <div class="scene"><img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/scene.png"></div>
    <div class="foot">
      <div class="card">
        <div class="pic"><img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/p_open_pad.png"></div>
        <div class="cap">กางออก ใช้งานเต็มที่</div>
        <div class="sub">ความจุ 36 ลิตร</div>
      </div>
      <div class="card">
        <div class="pic"><img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/p_full_pad.png"></div>
        <div class="cap">พับแบน เหลือที่ว่าง</div>
        <div class="sub">พับบาง ไม่เกะกะ</div>
      </div>
    </div>
  </div>
</body>
</html>
