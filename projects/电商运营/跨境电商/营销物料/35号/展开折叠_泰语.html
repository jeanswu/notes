<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family:'Thai'; src:url('file:///usr/share/fonts/truetype/noto/NotoSansThai-Regular.ttf') format('truetype'); font-weight:400; }
  @font-face { font-family:'Thai'; src:url('file:///usr/share/fonts/truetype/noto/NotoSansThai-Bold.ttf') format('truetype'); font-weight:700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:#ffffff; font-family:'Thai',sans-serif; overflow:hidden; }
  .wrap { width:1080px; height:1080px; padding:64px 56px 0; }

  .head { text-align:center; }
  .h1 { font-size:58px; font-weight:700; color:#111; line-height:1.3; }
  .h2 { font-size:24px; color:#909090; margin-top:10px; }
  .rule { width:76px; height:5px; background:#111; border-radius:3px; margin:22px auto 0; }

  .stage { margin-top:48px; display:flex; align-items:center; justify-content:space-between; }
  .item { width:46%; text-align:center; }
  .picbox { width:100%; height:380px; display:flex; align-items:center; justify-content:center; }
  .picbox img { max-width:100%; max-height:380px; object-fit:contain; display:block; }
  .tag { display:inline-block; margin-top:14px; background:#111; color:#fff;
         font-size:26px; font-weight:700; padding:12px 34px; border-radius:40px; }
  .sub { margin-top:10px; font-size:21px; color:#9a9a9a; }

  .arrow { width:56px; height:380px; display:flex; align-items:center; justify-content:center; }
  .arrow svg { width:48px; height:48px; }

  .foot { margin-top:50px; background:#111; border-radius:18px; padding:22px 0; text-align:center; }
  .foot span { font-size:27px; font-weight:700; color:#fff; letter-spacing:0.3px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="h1">กางก็จุ พับก็แบน</div>
    <div class="h2">ไม่ใช้ก็พับเก็บ ประหยัดพื้นที่ท้ายรถ</div>
    <div class="rule"></div>
  </div>

  <div class="stage">
    <div class="item">
      <div class="picbox"><img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/p_open2_pad.png"></div>
      <div class="tag">ความจุ 36 ลิตร</div>
      <div class="sub">กางใช้งาน</div>
    </div>

    <div class="arrow">
      <svg viewBox="0 0 48 48"><path d="M8 24h28M26 12l12 12-12 12" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="item">
      <div class="picbox"><img src="file:///Coze/Drive/电商运营/跨境电商/营销物料/35号/p_full2_pad.png"></div>
      <div class="tag">พับบาง ไม่เกะกะ</div>
      <div class="sub">พับเก็บสนิท</div>
    </div>
  </div>

  <div class="foot">
    <span>กาง 35 × 35 × 30 ซม.  ·  พับเก็บได้บาง</span>
  </div>

</div>
</body>
</html>
